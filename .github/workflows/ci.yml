name: CI - Build & Test Coverage

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Backend Build + JaCoCo Coverage
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: even_qr
          MYSQL_USER: eventqr
          MYSQL_PASSWORD: eventqr
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=15s
          --health-timeout=10s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Import database schema
        run: |
          mysql -h 127.0.0.1 -u root -proot even_qr < database/even_qr.sql

      - name: Run unit tests with JaCoCo coverage
        run: mvn -f backend/pom.xml clean verify
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/even_qr?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: warn

      - name: Generate JaCoCo coverage badge
        id: jacoco-badge
        uses: cicirello/jacoco-badge-generator@v2
        with:
          generate-branches-badge: true
          generate-summary: true
          jacoco-csv-file: backend/target/site/jacoco/jacoco.csv
          badges-directory: .github/badges

      - name: Upload coverage badge artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badges
          path: .github/badges/

      - name: Comment coverage on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('.github/badges/coverage-summary.json', 'utf8');
            const data = JSON.parse(summary);
            const instructions = data.instructions ?? 0;
            const branches = data.branches ?? 0;
            const lines = data.lines ?? 0;
            const pct = (v) => (v * 100).toFixed(2);
            const body =
              '## Coverage Report (JaCoCo)\n' +
              '| Metric | Coverage |\n' +
              '|--------|---------|\n' +
              '| Instructions | ' + pct(instructions) + '% |\n' +
              '| Branches | ' + pct(branches) + '% |\n' +
              '| Lines | ' + pct(lines) + '% |\n' +
              '\n_Generated by JaCoCo + GitHub Actions_';
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number
            });
            const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('Coverage Report'));
            if (botComment) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body
              });
            }

  e2e-tests:
    name: E2E Tests (Playwright + Cypress)
    runs-on: ubuntu-latest
    needs: build

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: even_qr
          MYSQL_USER: eventqr
          MYSQL_PASSWORD: eventqr
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=15s
          --health-timeout=10s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Import database schema
        run: |
          mysql -h 127.0.0.1 -u root -proot even_qr < database/even_qr.sql

      - name: Start backend server
        run: |
          mvn -f backend/pom.xml spring-boot:run -DskipTests &
          sleep 30
          curl --retry 10 --retry-delay 5 --retry-connrefused http://localhost:8080/api/auth/test
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/even_qr?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
          SERVER_PORT: 8080

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Playwright dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Install Cypress dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Playwright tests
        run: npx playwright test --project=api

      - name: Upload Playwright report
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Run Cypress tests
        run: |
          cd frontend
          npx cypress run

      - name: Upload Cypress screenshots
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots/
