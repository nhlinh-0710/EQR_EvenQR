<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Image API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .section {
            margin: 20px 0;
            padding: 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
        }
        .event-card {
            margin: 10px 0;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background: #f9f9f9;
        }
        .event-card img {
            max-width: 300px;
            height: auto;
            border: 2px solid #666;
            margin: 10px 0;
        }
        pre {
            background: #f4f4f4;
            padding: 10px;
            overflow-x: auto;
            font-size: 12px;
        }
        .error {
            color: red;
            font-weight: bold;
        }
        .success {
            color: green;
            font-weight: bold;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <h1>🧪 Test Image API - EventQR</h1>
    
    <div class="section">
        <h2>Bước 1: Kiểm tra Backend hoạt động</h2>
        <button onclick="testBackend()">Test Backend Connection</button>
        <div id="backend-status"></div>
    </div>

    <div class="section">
        <h2>Bước 2: Lấy danh sách sự kiện</h2>
        <button onclick="fetchEvents()">Lấy tất cả sự kiện</button>
        <div id="events-list"></div>
    </div>

    <div class="section">
        <h2>Bước 3: Test Image URL trực tiếp</h2>
        <p>Nhập đường dẫn file ảnh để test:</p>
        <input type="text" id="test-path" style="width: 500px;" placeholder="D:\EventQR_Images\uuid.jpg">
        <button onclick="testImageUrl()">Test Image</button>
        <div id="image-test-result"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080';

        async function testBackend() {
            const statusDiv = document.getElementById('backend-status');
            statusDiv.innerHTML = '<p>Đang kiểm tra...</p>';
            
            try {
                const response = await fetch(`${API_BASE}/api/events`);
                if (response.ok) {
                    statusDiv.innerHTML = '<p class="success">✅ Backend hoạt động bình thường!</p>';
                } else {
                    statusDiv.innerHTML = `<p class="error">❌ Backend trả về lỗi: ${response.status}</p>`;
                }
            } catch (error) {
                statusDiv.innerHTML = `<p class="error">❌ Không thể kết nối backend: ${error.message}</p>
                <p>Hãy đảm bảo backend đang chạy tại http://localhost:8080</p>`;
            }
        }

        async function fetchEvents() {
            const listDiv = document.getElementById('events-list');
            listDiv.innerHTML = '<p>Đang tải...</p>';
            
            try {
                const response = await fetch(`${API_BASE}/api/events`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const events = await response.json();
                console.log('📋 Events:', events);
                
                if (events.length === 0) {
                    listDiv.innerHTML = '<p>Không có sự kiện nào</p>';
                    return;
                }

                let html = `<p class="success">✅ Tìm thấy ${events.length} sự kiện</p>`;
                
                events.forEach(event => {
                    const imageUrl = event.imageUrl;
                    let fullImageUrl = '';
                    
                    if (imageUrl) {
                        if (imageUrl.startsWith('http://') || imageUrl.startsWith('https://')) {
                            fullImageUrl = imageUrl;
                        } else if (imageUrl.startsWith('/')) {
                            fullImageUrl = API_BASE + imageUrl;
                        } else {
                            fullImageUrl = API_BASE + '/images/' + imageUrl;
                        }
                    }

                    html += `
                        <div class="event-card">
                            <h3>${event.title}</h3>
                            <p><strong>Event ID:</strong> ${event.eventId}</p>
                            <p><strong>Location:</strong> ${event.location}</p>
                            <p><strong>Status:</strong> ${event.status}</p>
                            
                            <p><strong>Image URL từ API:</strong></p>
                            <pre>${imageUrl || 'null'}</pre>
                            
                            <p><strong>Full URL:</strong></p>
                            <pre>${fullImageUrl}</pre>
                            
                            ${imageUrl ? `
                                <p><strong>Test hiển thị ảnh:</strong></p>
                                <img src="${fullImageUrl}" 
                                     alt="${event.title}"
                                     onerror="this.parentElement.innerHTML += '<p class=error>❌ Không thể load ảnh!</p>';"
                                     onload="this.parentElement.innerHTML += '<p class=success>✅ Ảnh load thành công!</p>';">
                            ` : '<p class="error">❌ Không có ảnh</p>'}
                        </div>
                    `;
                });
                
                listDiv.innerHTML = html;
                
            } catch (error) {
                listDiv.innerHTML = `<p class="error">❌ Lỗi: ${error.message}</p>`;
                console.error('Error:', error);
            }
        }

        function testImageUrl() {
            const path = document.getElementById('test-path').value;
            const resultDiv = document.getElementById('image-test-result');
            
            if (!path) {
                resultDiv.innerHTML = '<p class="error">❌ Vui lòng nhập đường dẫn file!</p>';
                return;
            }
            
            const encodedPath = encodeURIComponent(path);
            const apiUrl = `${API_BASE}/api/images/view?path=${encodedPath}`;
            
            resultDiv.innerHTML = `
                <p><strong>API URL:</strong></p>
                <pre>${apiUrl}</pre>
                <p><strong>Test hiển thị:</strong></p>
                <img src="${apiUrl}" 
                     style="max-width: 400px;"
                     onerror="this.parentElement.innerHTML += '<p class=error>❌ Không thể load ảnh! Kiểm tra:<br>1. File có tồn tại không?<br>2. Backend có đang chạy không?<br>3. Đường dẫn có đúng không?</p>';"
                     onload="this.parentElement.innerHTML += '<p class=success>✅ Ảnh load thành công!</p>';">
            `;
        }

        // Auto test khi load trang
        window.onload = function() {
            testBackend();
        };
    </script>
</body>
</html>
